name: Deploy Site
on:
  push:
    branches: [main]
    paths:
      - 'engineers/*.md'
      # engineers.11tydata.js computes each profile's SEO title/description,
      # so a change there alters every built profile page.
      - 'engineers/*.js'
      - 'chapters/**'
      - 'jobs/**'
      - 'site/**'
      - 'scripts/**'
      - '.eleventy.js'
      - 'package.json'
      - 'package-lock.json'
  # Pushes made with GITHUB_TOKEN don't fire the push trigger above, so
  # workflows that commit site content need to be listed here explicitly.
  workflow_run:
    workflows: ['Import Jobs', 'Sync Chapters']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        env:
          NODE_OPTIONS: --no-deprecation
